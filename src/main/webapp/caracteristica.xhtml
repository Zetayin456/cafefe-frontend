<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Características - Cafefe POS</ui:define>
    <ui:define name="header_titulo">Administración de Características</ui:define>

    <ui:define name="contenido">
        <h:form id="frmNuevo">
            <p:panel header="Datos de característica" style="margin-top: 1rem;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="id" value="ID (Autogenerado):" />
                    <p:inputText id="id" value="#{caracteristicaBean.registro.idCaracteristica}" disabled="true" placeholder="UUID Automático" />

                    <p:outputLabel for="cboTipo" value="Tipo de Característica (Solo Activos):" />
                    <p:selectOneMenu id="cboTipo"
                                     value="#{caracteristicaBean.registro.idTipoCaracteristica}"
                                     converter="tipoCaracteristicaConverter"
                                     required="true"
                                     disabled="#{caracteristicaBean.registro.idCaracteristica != null}"
                                     requiredMessage="Debe seleccionar un Tipo de Característica">
                        <f:selectItem itemLabel="-- Seleccione un tipo --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{caracteristicaBean.tiposCaracteristicaActivos}"
                                       var="tipo"
                                       itemLabel="#{tipo.nombre}"
                                       itemValue="#{tipo}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre" value="#{caracteristicaBean.registro.nombre}" required="true" />

                    <p:outputLabel for="activo" value="Activo:" />
                    <p:selectBooleanCheckbox id="activo" value="#{caracteristicaBean.registro.activo}" />

                    <p:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{caracteristicaBean.registro.observaciones}" rows="3" cols="30" />
                </h:panelGrid>

                <br/>
                <p:commandButton value="Guardar"
                                 actionListener="#{caracteristicaBean.guardar()}"
                                 update=":frmTabla:dtCaracteristica :messages"
                                 icon="pi pi-check" />
                <p:commandButton value="Limpiar" actionListener="#{caracteristicaBean.limpiar()}" update="frmNuevo" icon="pi pi-eraser" styleClass="ui-button-secondary" />
            </p:panel>
        </h:form>

        <h:form id="frmTabla">
            <p:panel header="Gestión de Características">
                <p:dataTable id="dtCaracteristica"
                             value="#{caracteristicaBean.lista}"
                             var="row"
                             paginator="true"
                             rows="10">

                    <p:column headerText="ID">
                        <h:outputText value="#{row.idCaracteristica}" />
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{row.nombre}" />
                    </p:column>

                    <p:column headerText="Tipo de Característica">
                        <h:outputText value="#{row.idTipoCaracteristica.nombre}" />
                    </p:column>

                    <p:column headerText="Estado">
                        <h:outputText value="#{row.activo ? 'ACTIVO' : 'INACTIVO'}" />
                    </p:column>

                    <p:column headerText="Observaciones">
                        <h:outputText value="#{row.observaciones}" />
                    </p:column>

                    <p:column headerText="Acciones">
                        <p:commandButton icon="pi pi-pencil"
                                         update=":frmNuevo"
                                         process="@this">
                            <f:setPropertyActionListener value="#{row}" target="#{caracteristicaBean.registro}" />
                        </p:commandButton>
                        <p:commandButton icon="pi pi-trash" title="Eliminar" action="#{caracteristicaBean.eliminar(row)}" update=":frmTabla:dtCaracteristica :messages">
                            <p:confirm header="Confirmar eliminación" message="¿Desea eliminar esta característica?" icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>
            </p:panel>
        </h:form>


    </ui:define>

</ui:composition>
