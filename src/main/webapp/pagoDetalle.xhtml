<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Detalle de Pagos</ui:define>
    <ui:define name="header_titulo">Administración de Detalle de Pagos</ui:define>

    <ui:define name="contenido">
        <h:form id="frmPagoDetalle">
            <p:panel header="Formulario Detalle de Pago">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="monto" value="Monto:" />
                    <p:inputText id="monto" value="#{pagoDetalleFrm.registroSeleccionado.monto}" required="true" />
                </h:panelGrid>
                
                <p:commandButton value="Guardar" actionListener="#{pagoDetalleFrm.btnGuardarHandler()}" 
                                 update="frmPagoDetalle :messages" icon="pi pi-save" />
                <p:commandButton value="Nuevo" action="#{pagoDetalleFrm.nuevoRegistro()}" update="frmPagoDetalle" immediate="true" icon="pi pi-plus" />
            </p:panel>

            <p:spacer height="20" />

            <p:dataTable value="#{pagoDetalleFrm.registros}" var="pd" id="tblPagoDetalle" paginator="true" rows="10">
                <p:column headerText="ID Detalle">
                    <h:outputText value="#{pd.idPagoDetalle}" />
                </p:column>
                <p:column headerText="Monto">
                    <h:outputText value="#{pd.monto}" />
                </p:column>
                <p:column headerText="Acciones">
                    <p:commandButton icon="pi pi-pencil" title="Editar" action="#{pagoDetalleFrm.seleccionar(pd)}" update="frmPagoDetalle" />
                    <p:commandButton icon="pi pi-trash" title="Eliminar" action="#{pagoDetalleFrm.eliminar(pd)}" update="frmPagoDetalle :messages">
                        <p:confirm header="Confirmar eliminación" message="¿Desea eliminar este detalle de pago?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
            <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>
