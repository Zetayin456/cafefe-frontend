<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Pagos</ui:define>
    <ui:define name="header_titulo">Administración de Pagos</ui:define>

    <ui:define name="contenido">
        <h:form id="frmPago">
            <p:panel header="Formulario de Pago">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="estado" value="Estado:" />
                    <p:inputText id="estado" value="#{pagoBean.registro.estado}" required="true" />

                    <p:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{pagoBean.registro.observaciones}" rows="3" cols="30" />
                </h:panelGrid>
                
                <p:commandButton value="Guardar" actionListener="#{pagoBean.guardar()}" 
                                 update="frmPago :messages" icon="pi pi-save" />
                <p:commandButton value="Nuevo" action="#{pagoBean.nuevoRegistro()}" update="frmPago" immediate="true" icon="pi pi-plus" />
            </p:panel>

            <p:spacer height="20" />

            <p:dataTable value="#{pagoBean.lista}" var="pg" id="tblPago" paginator="true" rows="10">
                <p:column headerText="ID">
                    <h:outputText value="#{pg.idPago}" />
                </p:column>
                <p:column headerText="Estado">
                    <h:outputText value="#{pg.estado}" />
                </p:column>
                <p:column headerText="Observaciones">
                    <h:outputText value="#{pg.observaciones}" />
                </p:column>
                <p:column headerText="Acciones">
                    <p:commandButton icon="pi pi-pencil" title="Editar" action="#{pagoBean.seleccionar(pg)}" update="frmPago" />
                    <p:commandButton icon="pi pi-trash" title="Eliminar" action="#{pagoBean.eliminar(pg)}" update="frmPago :messages">
                        <p:confirm header="Confirmar eliminación" message="¿Desea eliminar este pago?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
            <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>
