<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Tipos de Característica - Cafefe POS</ui:define>
    <ui:define name="header_titulo">Tipos de Característica</ui:define>

    <ui:define name="contenido">
        <h:form id="frmNuevo">
            <p:panel header="Datos del tipo de característica" style="margin-top: 1rem;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="id" value="ID (Autogenerado):" />
                    <p:inputText id="id" value="#{tipoCaracteristicaBean.registro.idTipoCaracteristica}" disabled="true" placeholder="UUID Automático" />

                    <p:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre" value="#{tipoCaracteristicaBean.registro.nombre}" required="true" />

                    <p:outputLabel for="expresion" value="Expresión Regular:" />
                    <p:inputText id="expresion" value="#{tipoCaracteristicaBean.registro.expresionRegular}" placeholder="Ej: ^\d+$" />

                    <p:outputLabel for="activo" value="Activo:" />
                    <p:selectBooleanCheckbox id="activo" value="#{tipoCaracteristicaBean.registro.activo}" />

                    <p:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{tipoCaracteristicaBean.registro.observaciones}" rows="3" cols="30" />
                </h:panelGrid>

                <br/>
                <p:commandButton value="Guardar"
                                 actionListener="#{tipoCaracteristicaBean.guardar()}"
                                 update=":frmTabla:dtTipoCaracteristica :messages"
                                 icon="pi pi-check" />
                <p:commandButton value="Limpiar" actionListener="#{tipoCaracteristicaBean.limpiar()}" update="frmNuevo" icon="pi pi-eraser" styleClass="ui-button-secondary" />
            </p:panel>
        </h:form>

        <h:form id="frmTabla">
            <p:panel header="Gestión de Tipos de Característica">
                <p:button value="Volver a Tipo Descuento"
                          outcome="TipoDescuento"
                          icon="pi pi-arrow-left"
                          styleClass="ui-button-secondary"
                          style="margin-left: 10px;" />

                <p:dataTable id="dtTipoCaracteristica"
                             value="#{tipoCaracteristicaBean.lista}"
                             var="row"
                             paginator="true"
                             rows="10">

                    <p:column headerText="ID">
                        <h:outputText value="#{row.idTipoCaracteristica}" />
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{row.nombre}" />
                    </p:column>

                    <p:column headerText="Expresión Regular">
                        <h:outputText value="#{row.expresionRegular}" />
                    </p:column>

                    <p:column headerText="Estado">
                        <h:outputText value="#{row.activo ? 'ACTIVO' : 'INACTIVO'}" />
                    </p:column>

                    <p:column headerText="Observaciones">
                        <h:outputText value="#{row.observaciones}" />
                    </p:column>

                    <p:column headerText="Acciones">
                        <p:commandButton icon="pi pi-pencil"
                                         update=":frmNuevo"
                                         process="@this">
                            <f:setPropertyActionListener value="#{row}" target="#{tipoCaracteristicaBean.registro}" />
                        </p:commandButton>
                        <p:commandButton icon="pi pi-trash" title="Eliminar" action="#{tipoCaracteristicaBean.eliminar(row)}" update=":frmTabla:dtTipoCaracteristica :messages">
                            <p:confirm header="Confirmar eliminación" message="¿Desea eliminar este tipo de característica?" icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>
            </p:panel>
        </h:form>


    </ui:define>

</ui:composition>
