<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Cajas</ui:define>
    <ui:define name="header_titulo">Administración de Cajas</ui:define>

    <ui:define name="contenido">
        <h:form id="frmCaja">
            <p:panel header="Formulario de Caja">
                <h:panelGrid columns="2">
                    <p:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre" value="#{cajaBean.registro.nombre}" required="true" />
                </h:panelGrid>
                
                <p:commandButton value="Guardar" actionListener="#{cajaBean.guardar()}" 
                                 update="frmCaja :messages" icon="pi pi-save" />
                <p:commandButton value="Nuevo" action="#{cajaBean.nuevoRegistro()}" update="frmCaja" immediate="true" icon="pi pi-plus" />
            </p:panel>

            <p:spacer height="20" />

            <p:dataTable value="#{cajaBean.lista}" var="c" id="tblCaja" paginator="true" rows="10">
                <p:column headerText="ID">
                    <h:outputText value="#{c.idCaja}" />
                </p:column>
                <p:column headerText="Nombre">
                    <h:outputText value="#{c.nombre}" />
                </p:column>
                <p:column headerText="Acciones">
                    <p:commandButton icon="pi pi-pencil" title="Editar" action="#{cajaBean.seleccionar(c)}" update="frmCaja" />
                    <p:commandButton icon="pi pi-trash" title="Eliminar" action="#{cajaBean.eliminar(c)}" update="frmCaja :messages">
                        <p:confirm header="Confirmar eliminación" message="¿Desea eliminar esta caja?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
            <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>
