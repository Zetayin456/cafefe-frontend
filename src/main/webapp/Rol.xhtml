<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Roles</ui:define>

    <ui:define name="header_titulo">
        Administración de Roles de Usuario
    </ui:define>

    <ui:define name="contenido">

        <p:messages id="messagesRol"
                    showDetail="true"
                    closable="true" />

        <div style="display: flex; gap: 20px; flex-wrap: wrap;">

            <div style="flex: 1; min-width: 320px;">
                <p:card>
                    <f:facet name="title">
                        <i class="pi pi-shield"
                           style="margin-right: 8px;"></i>
                        #{rolFrm.registroSeleccionado.idRol == null ? 'Nuevo Rol' : 'Editar Rol'}
                    </f:facet>

                    <h:form id="frmNuevoRol">

                        <p:messages id="formMessagesRol"
                                    showDetail="true"
                                    closable="true" />

                        <div style="display: flex; flex-direction: column; gap: 15px;">

                            <div>
                                <p:outputLabel value="Nombre del Rol:"
                                               for="txtNombre" />

                                <p:inputText id="txtNombre"
                                             value="#{rolFrm.registroSeleccionado.nombre}"
                                             required="true"
                                             requiredMessage="El nombre del rol es obligatorio."
                                             maxlength="255"
                                             placeholder="Ej. Administrador, Cajero"
                                             style="width: 100%;" />
                            </div>

                            <div style="display: flex; align-items: center; gap: 10px;">
                                <p:selectBooleanCheckbox id="chkActivo"
                                                         value="#{rolFrm.registroSeleccionado.activo}" />

                                <p:outputLabel value="Rol activo"
                                               for="chkActivo" />
                            </div>

                            <div>
                            <p:outputLabel value="Observaciones / Descripción:"
                                               for="txtComentarios" />

                                <p:inputTextarea id="txtComentarios"
                                                 value="#{rolFrm.registroSeleccionado.observaciones}"
                                                 rows="3"
                                                 maxlength="2000"
                                                 style="width: 100%;" />
                            </div>

                            <div style="display: flex; gap: 10px; margin-top: 10px;">

                                <p:commandButton value="Guardar"
                                                 actionListener="#{rolFrm.guardar()}"
                                                 process="@form"
                                                 update=":frmTablaRol:tblRol :messagesRol formMessagesRol"
                                                 icon="pi pi-save"
                                                 styleClass="ui-button-info"
                                                 style="flex: 1;" />

                                <p:commandButton value="Limpiar"
                                                 actionListener="#{rolFrm.nuevoRegistro()}"
                                                 process="@this"
                                                 update="@form"
                                                 icon="pi pi-refresh"
                                                 styleClass="ui-button-outlined ui-button-secondary" />

                            </div>
                        </div>
                    </h:form>
                </p:card>
            </div>

            <div style="flex: 2; min-width: 450px;">
                <p:card>
                    <f:facet name="title">
                        <i class="pi pi-list"
                           style="margin-right: 8px;"></i>
                        Roles Registrados
                    </f:facet>

                    <h:form id="frmTablaRol">

                        <p:dataTable id="tblRol"
                                     var="r"
                                     value="#{rolFrm.listaRol}"
                                     paginator="true"
                                     rows="6"
                                     paginatorPosition="bottom"
                                     emptyMessage="No hay roles registrados.">

                            <p:column headerText="ID" style="width: 60px; text-align: center;">
                                <h:outputText value="#{r.idRol}" />
                            </p:column>

                            <p:column headerText="Nombre">
                                <h:outputText value="#{r.nombre}" style="font-weight: bold;" />
                            </p:column>

                            <p:column headerText="Estado" style="width: 100px; text-align: center;">
                                <p:tag value="#{r.activo ? 'ACTIVO' : 'INACTIVO'}"
                                       severity="#{r.activo ? 'success' : 'danger'}" />
                            </p:column>

                            <p:column headerText="Observaciones">
                                <h:outputText value="#{r.observaciones}" />
                            </p:column>

                            <p:column headerText="Acciones" style="width: 110px; text-align: center;">

                                <p:commandButton icon="pi pi-pencil"
                                                 title="Editar"
                                                 actionListener="#{rolFrm.seleccionar(r)}"
                                                 process="@this"
                                                 update=":frmNuevoRol"
                                                 styleClass="ui-button-warning"
                                                 style="margin-right: 5px;" />

                                <p:commandButton icon="pi pi-trash"
                                                 title="Desactivar"
                                                 actionListener="#{rolFrm.eliminar(r)}"
                                                 process="@this"
                                                 update="tblRol :messagesRol"
                                                 disabled="#{not r.activo}"
                                                 styleClass="ui-button-danger">

                                    <p:confirm header="Confirmar desactivación"
                                               message="¿Deseas desactivar este rol?"
                                               icon="pi pi-exclamation-triangle" />
                                </p:commandButton>

                            </p:column>

                        </p:dataTable>

                        <p:confirmDialog global="true"
                                         showEffect="fade"
                                         hideEffect="fade">
                            <p:commandButton value="Sí"
                                             type="button"
                                             styleClass="ui-confirmdialog-yes"
                                             icon="pi pi-check" />

                            <p:commandButton value="No"
                                             type="button"
                                             styleClass="ui-confirmdialog-no"
                                             icon="pi pi-times" />
                        </p:confirmDialog>

                    </h:form>
                </p:card>
            </div>

        </div>

    </ui:define>

</ui:composition>
