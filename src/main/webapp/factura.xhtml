<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Facturas</ui:define>

    <ui:define name="contenido">
        <h:form id="frmFactura">
            <p:growl id="messages" showDetail="true" />

            <p:panel header="Formulario Factura" style="margin-bottom:20px">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="id" value="ID Factura:" />
                    <p:inputText id="id" value="#{facturaFrm.registroSeleccionado.idFactura}" readonly="true" />

                    <p:outputLabel for="cliente" value="Cliente:" />
                    <p:inputText id="cliente" value="#{facturaFrm.registroSeleccionado.cliente}" />

                    <p:outputLabel for="estado" value="Estado:" />
                    <p:inputText id="estado" value="#{facturaFrm.registroSeleccionado.estado}" />

                    <p:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{facturaFrm.registroSeleccionado.observaciones}" rows="3" />
                </h:panelGrid>

                <h:panelGroup style="margin-top:10px; display:block">
                    <p:commandButton value="Guardar" actionListener="#{facturaFrm.btnGuardarHandler}" update="frmFactura" styleClass="ui-button-success" style="margin-right:10px" />
                    <p:commandButton value="Nuevo" actionListener="#{facturaFrm.nuevoRegistro}" update="frmFactura" styleClass="ui-button-secondary" style="margin-right:10px" />
                    <p:commandButton value="Eliminar" actionListener="#{facturaFrm.btnEliminarHandler}" update="frmFactura" styleClass="ui-button-danger" icon="pi pi-trash">
                        <p:confirm header="Confirmar eliminación" message="¿Desea eliminar la factura seleccionada?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </h:panelGroup>
            </p:panel>
            <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>

            <p:panel header="Listado de Facturas">
                <p:dataTable var="f" value="#{facturaFrm.modelo}" lazy="true" paginator="true" rows="5"
                             selectionMode="single" selection="#{facturaFrm.registroSeleccionado}" rowKey="#{f.idFactura}">
                    <p:ajax event="rowSelect" update=":frmFactura" />

                    <p:column headerText="ID">
                        <h:outputText value="#{f.idFactura}" />
                    </p:column>
                    <p:column headerText="Cliente">
                        <h:outputText value="#{f.cliente}" />
                    </p:column>
                    <p:column headerText="Estado">
                        <h:outputText value="#{f.estado}" />
                    </p:column>
                    <p:column headerText="Observaciones">
                        <h:outputText value="#{f.observaciones}" />
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
