<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Factura Orden Producto</ui:define>

    <ui:define name="contenido">
        <h:form id="frmFacturaOrdenProducto">
            <p:growl id="messages" showDetail="true" />

            <p:panel header="Formulario Factura Orden Producto" style="margin-bottom:20px">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="id" value="ID:" />
                    <p:inputText id="id" value="#{facturaOrdenProductoFrm.registroSeleccionado.idFacturaOrdenProducto}" readonly="true" />

                    <p:outputLabel for="precio" value="Precio:" />
                    <p:inputNumber id="precio" value="#{facturaOrdenProductoFrm.registroSeleccionado.precio}" decimalPlaces="2" />

                    <p:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{facturaOrdenProductoFrm.registroSeleccionado.observaciones}" rows="3" />
                </h:panelGrid>

                <h:panelGroup style="margin-top:10px; display:block">
                    <p:commandButton value="Guardar" actionListener="#{facturaOrdenProductoFrm.btnGuardarHandler}" update="frmFacturaOrdenProducto" styleClass="ui-button-success" style="margin-right:10px" />
                    <p:commandButton value="Nuevo" actionListener="#{facturaOrdenProductoFrm.nuevoRegistro}" update="frmFacturaOrdenProducto" styleClass="ui-button-secondary" style="margin-right:10px" />
                    <p:commandButton value="Eliminar" actionListener="#{facturaOrdenProductoFrm.btnEliminarHandler}" update="frmFacturaOrdenProducto" styleClass="ui-button-danger" icon="pi pi-trash">
                        <p:confirm header="Confirmar eliminación" message="¿Desea eliminar el registro seleccionado?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </h:panelGroup>
            </p:panel>
            <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>

            <p:panel header="Listado Factura Orden Producto">
                <p:dataTable var="fop" value="#{facturaOrdenProductoFrm.modelo}" lazy="true" paginator="true" rows="5"
                             selectionMode="single" selection="#{facturaOrdenProductoFrm.registroSeleccionado}" rowKey="#{fop.idFacturaOrdenProducto}">
                    <p:ajax event="rowSelect" update=":frmFacturaOrdenProducto" />

                    <p:column headerText="ID">
                        <h:outputText value="#{fop.idFacturaOrdenProducto}" />
                    </p:column>
                    <p:column headerText="Precio">
                        <h:outputText value="#{fop.precio}" />
                    </p:column>
                    <p:column headerText="Observaciones">
                        <h:outputText value="#{fop.observaciones}" />
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
