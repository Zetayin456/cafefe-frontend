<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">
        Gestión de Tipo de Descuento
    </ui:define>

    <ui:define name="header_titulo">
        Gestión de Tipos de Descuento
    </ui:define>

    <ui:define name="contenido">

        <h:form id="frmNuevo">
            <p:panel header="Datos del tipo de descuento" style="margin-top: 1rem;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="Nombre:" for="txtNombre" />
                    <p:inputText id="txtNombre" value="#{tipoDescuentoFrm.registroSeleccionado.nombre}" required="true" />

                    <p:outputLabel value="Descuento Máximo (%):" for="txtMaximo" />
                    <p:spinner id="txtMaximo" value="#{tipoDescuentoFrm.registroSeleccionado.descuentoMaximo}" min="1" max="100" required="true" />

                    <p:outputLabel value="Activo:" for="chkActivo" />
                    <p:selectBooleanCheckbox id="chkActivo" value="#{tipoDescuentoFrm.registroSeleccionado.activo}" />

                    <p:outputLabel value="Observaciones:" for="txtObs" />
                    <p:inputTextarea id="txtObs" value="#{tipoDescuentoFrm.registroSeleccionado.observaciones}" rows="3" cols="30" />
                </h:panelGrid>

                <div style="text-align: right; margin-top: 10px;">
                    <p:commandButton value="Guardar"
                                     actionListener="#{tipoDescuentoFrm.btnGuardarHandler()}"
                                     update=":frmTabla:tblTipoDescuento :frmNuevo"
                                     icon="pi pi-check" />
                    <p:commandButton value="Limpiar" actionListener="#{tipoDescuentoFrm.btnNuevoHandler()}" update="frmNuevo" icon="pi pi-eraser" styleClass="ui-button-secondary" />
                </div>
            </p:panel>
        </h:form>

        <h:form id="frmTabla">
            <p:dataTable id="tblTipoDescuento"
                         value="#{tipoDescuentoFrm.registros}"
                         var="item"
                         paginator="true"
                         rows="10"
                         emptyMessage="No se encontraron registros">

                <p:column headerText="ID">
                    <h:outputText value="#{item.idTipoDescuento}" />
                </p:column>
                <p:column headerText="Nombre">
                    <h:outputText value="#{item.nombre}" />
                </p:column>
                <p:column headerText="Descuento Máximo (%)">
                    <h:outputText value="#{item.descuentoMaximo}%" />
                </p:column>
                <p:column headerText="Estado">
                    <h:outputText value="#{item.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>
                <p:column headerText="Observaciones">
                    <h:outputText value="#{item.observaciones}" />
                </p:column>
                <p:column headerText="Acciones">
                    <p:commandButton icon="pi pi-pencil" title="Editar" action="#{tipoDescuentoFrm.seleccionar(item)}" update=":frmNuevo" process="@this" />
                    <p:commandButton icon="pi pi-trash" title="Eliminar" action="#{tipoDescuentoFrm.eliminar(item)}" update=":frmTabla:tblTipoDescuento :messages">
                        <p:confirm header="Confirmar eliminación" message="¿Desea eliminar este tipo de descuento?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
            <p:confirmDialog global="true"><p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/><p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/></p:confirmDialog>
        </h:form>


    </ui:define>

</ui:composition>
